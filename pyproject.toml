[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-elastic"
version = "0.0.1"
description = "Django models mapping and flexible indexer for ElasticSearch."
readme = "README.rst"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rangertaha", email = "rangertaha@gmail.com" },
]
maintainers = [
    { name = "Rangertaha", email = "rangertaha@gmail.com" },
]
keywords = ["django", "elasticsearch", "search", "indexing"]
dependencies = [
    "Django>=5.2,<6.0",
    "elasticsearch>=9.0,<10.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
]

[project.urls]
Homepage = "https://github.com/rangertaha/django-elastic"
Repository = "https://github.com/rangertaha/django-elastic"
Issues = "https://github.com/rangertaha/django-elastic/issues"
Changelog = "https://github.com/rangertaha/django-elastic/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["delastic*"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "example/simpleapp/migrations",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # long lines in legacy comments/docstrings
]

[tool.ruff.lint.isort]
known-first-party = ["delastic"]

[tool.mypy]
python_version = "3.12"
files = ["src/delastic"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.coverage.run]
source = ["delastic"]

[tool.coverage.report]
show_missing = true
