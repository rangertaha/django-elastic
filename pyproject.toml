[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-elastic"
version = "0.0.1"
description = "Django models mapping and flexible indexer for ElasticSearch."
readme = "README.rst"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Rangertaha", email = "rangertaha@gmail.com" },
]
maintainers = [
    { name = "Rangertaha", email = "rangertaha@gmail.com" },
]
dependencies = [
    "Django>=4.2,<6.0",
    "elasticsearch>=8.18,<10.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
]

[project.urls]
Homepage = "https://github.com/rangertaha/django-elastic"
Repository = "https://github.com/rangertaha/django-elastic"
Issues = "https://github.com/rangertaha/django-elastic/issues"

[tool.setuptools.packages.find]
include = ["delastic*"]
exclude = ["example*", "docs*"]
